controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    index_finger_controller:
      type: joint_trajectory_controller/JointTrajectoryController

index_finger_controller:
  ros__parameters:
    joints:
      - mcp_joint
      - pip
      - dip
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      mcp_joint:
        p: 100.0
        i: 0.0
        d: 0.1
      pip:
        p: 10.0
        i: 0.0
        d: 0.1
      dip:
        p: 10.0
        i: 0.0
        d: 0.1
